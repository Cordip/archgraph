[package]
name = "archgraph"
version = "0.1.0"
edition = "2021"
description = "A recursive architecture compiler over an external code graph"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
# CSS has no GitNexus support; ArchGraph reads stylesheets itself. Every
# lightningcss release is an alpha, so the version is pinned exactly.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23.2"
# Python imports for provider.packages (GitNexus drops unresolved imports).
tree-sitter-python = "0.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "signal", "time", "io-util"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
