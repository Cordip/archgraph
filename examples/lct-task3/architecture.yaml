# Desired architecture for lct-task3, a field-service planning app: a Python
# backend (FastAPI, OR-Tools) and a React + TypeScript frontend with one
# global stylesheet. Layers follow the repository's docs/architecture.md.
# This file is the only description of lct-task3's architecture: ArchGraph
# is a local tool and stays out of that repository.
#
#   archgraph --root /path/to/lct-task3 \
#       --config examples/lct-task3/architecture.yaml check
version: 1
project:
  name: lct-task3
  root: lct
  source_roots: [backend, frontend]
  exclude:
    - "**/node_modules/**"
    - "frontend/dist/**"
    - "**/*.{json,md,html,lock,tsbuildinfo}"
  # Files a tool or the runtime loads by name, which no observed code
  # imports; anything else nothing uses is a dead-code candidate (README.md).
  entry_points:
    - frontend/vite.config.ts        # read by Vite: `vite`, `vite build`
    - frontend/src/main.tsx          # index.html: <script type="module">
    - backend/planner/cli.py         # `python -m planner.cli` (Makefile)
    - backend/planner/api/app.py     # `uvicorn planner.api.app:app` (Dockerfile)
    - "backend/tests/**/test_*.py"   # collected by pytest (pyproject testpaths)
    - backend/tests/conftest.py      # loaded by pytest
    # Python runs a package's __init__.py before any module in it; GitNexus
    # links an import to the module only (docs/gitnexus-limitations.md, 13).
    - "backend/**/__init__.py"
provider:
  kind: gitnexus
  command: gitnexus
  repo: null
  page_size: 5000
  edge_types: &observed [IMPORTS, CALLS, EXTENDS, IMPLEMENTS, USES_CLASS, FETCHES]
  # Both are GitNexus guesses that are false here (see README.md).
  exclude_reasons: [markdown-link, property-dispatch, callable-value-flow]
  min_confidence: 0.6
  # GitNexus parses no CSS; ArchGraph reads the stylesheet and class names.
  css: true
  # GitNexus finds the FastAPI routes but not the frontend's calls through
  # its `request()` wrapper; ArchGraph matches those calls to the routes.
  http: true
  # GitNexus drops imports of third-party packages; ArchGraph reads them, so
  # `archgraph packages ortools` says who uses the solver.
  packages: true
policies:
  unassigned_files: warn
  ambiguous_mapping: error
nodes:
  lct:
    title: Field-service planner
  lct.backend:
    title: Python backend
  lct.backend.ingest:
    title: Data preparation
    description: Turns the raw export into scenario files; the service uses it to load and upload scenarios.
    maps: ["backend/planner/ingest/**"]
  lct.backend.core:
    title: Planning core
    description: Solver, validator (the only source of times and metrics), replanning, explanations.
  lct.backend.core.planning:
    title: Planning
    description: Solver, replanning, the baseline plan and the comparison with the manual assignment.
    maps: ["backend/planner/core/{solver,replan,baseline,control}.py"]
  lct.backend.core.reporting:
    title: Explanations and metrics
    description: Assignment explanations, reasons for unassigned orders, metrics and route geometry for the map.
    maps: ["backend/planner/core/{explain,reasons,metrics,geometry}.py"]
  lct.backend.core.validation:
    title: Validator
    description: The only place that computes route times and checks constraints.
    maps: ["backend/planner/core/validate.py"]
  lct.backend.core.domain:
    title: Domain rules
    description: Travel time, equipment, zones.
    maps: ["backend/planner/core/{travel,equipment,zones}.py"]
  lct.backend.core.base:
    title: Models and utilities
    description: Data models, time, texts, work types.
    maps: ["backend/planner/core/{models,timeutil,text,worktype,__init__}.py"]
  lct.backend.api:
    title: Web service
    description: FastAPI endpoints, background jobs, candidate previews, plan store.
  lct.backend.api.routes:
    title: Endpoints
    maps: ["backend/planner/api/{app,__init__}.py"]
  lct.backend.api.jobs:
    title: Background jobs
    maps: ["backend/planner/api/jobs.py"]
  lct.backend.api.candidates:
    title: Assignment previews
    maps: ["backend/planner/api/candidates.py"]
  lct.backend.api.store:
    title: Plan store
    maps: ["backend/planner/api/store.py"]
  lct.backend.cli:
    title: Command line
    description: Wires data preparation, core and scenarios together outside the service.
    maps: ["backend/planner/cli.py", "backend/planner/__*.py"]
  lct.backend.paths:
    title: Data locations
    maps: ["backend/planner/paths.py"]
  lct.frontend:
    title: Frontend
  lct.frontend.app:
    title: App state and orchestration
    maps: ["frontend/src/App.tsx", "frontend/src/main.tsx", "frontend/src/use*.ts"]
  lct.frontend.client:
    title: HTTP client
    description: The only code that talks to the backend.
    maps: ["frontend/src/api.ts"]
  lct.frontend.types:
    title: API types
    description: Shapes of the backend's JSON.
    maps: ["frontend/src/types.ts"]
  lct.frontend.logic:
    title: View logic
    description: Pure helpers deriving what the components show.
    maps: ["frontend/src/{derive,geo,sim,labels,colors,time}.ts"]
  lct.frontend.components:
    title: Components
  lct.frontend.components.screens:
    title: Screens
    description: The schedule and the simulation, assembled from panels.
    maps: ["frontend/src/components/{Schedule,Simulation}.tsx"]
  lct.frontend.components.panels:
    title: Panels
    description: Tables, the order queue, the Gantt chart, forms and control bars.
    maps: ["frontend/src/components/{Comparison,EngineerList,Gantt,JobPanel,JobQueue,KpiStrip,RouteTable,SimulationEventForm,Topbar,VariantBar}.tsx", "frontend/src/components/useJobCandidates.ts"]
  lct.frontend.components.map:
    title: Map
    maps: ["frontend/src/components/{MapView.tsx,mapIcons.ts}"]
  lct.frontend.components.common:
    title: Shared elements
    maps: ["frontend/src/components/common.tsx"]
  lct.frontend.styles:
    title: Stylesheet
    maps: ["frontend/src/**/*.css"]
  lct.frontend.build:
    title: Build configuration
    maps: ["frontend/*.ts"]
  lct.tests:
    title: Backend tests
    maps: ["backend/tests/**"]
  # Third-party packages; the ones not mapped here are in `packages`.
  libs:
    title: Third-party libraries
    kind: external
  libs.ortools:
    title: OR-Tools
    kind: external
    description: Google's routing solver, wrapped by core/solver.py.
    maps: ["package:python/ortools"]
edges: []
rules:
  # Data preparation builds core models; the core computes plans and must
  # not reach back into preparation or the service.
  - id: backend-layers
    kind: layers
    layers:
      - [lct.backend.cli, lct.backend.api]
      - lct.backend.ingest
      - lct.backend.core
      - lct.backend.paths
    edge_types: *observed
  # Inside the core: plans are built on explanations and metrics, those on
  # the validator, the validator on the domain rules, all of it on the models.
  - id: core-layers
    kind: layers
    layers:
      - lct.backend.core.planning
      - lct.backend.core.reporting
      - lct.backend.core.validation
      - lct.backend.core.domain
      - lct.backend.core.base
    edge_types: *observed
  # The endpoints assemble responses from the rest of the service; jobs,
  # previews and the store never call the endpoints.
  - id: api-layers
    kind: layers
    layers:
      - lct.backend.api.routes
      - [lct.backend.api.jobs, lct.backend.api.candidates, lct.backend.api.store]
    edge_types: *observed
  - id: production-code-does-not-use-tests
    kind: deny_dependency
    from: lct.backend
    to: lct.tests
    edge_types: *observed
  # The frontend is a client of the backend's HTTP API, and only the HTTP
  # client (api.ts) calls it; everything else goes through the client.
  - {id: app-calls-the-backend-through-the-client, kind: deny_dependency, from: lct.frontend.app, to: lct.backend, edge_types: [FETCHES]}
  - {id: components-call-the-backend-through-the-client, kind: deny_dependency, from: lct.frontend.components, to: lct.backend, edge_types: [FETCHES]}
  - {id: view-logic-calls-the-backend-through-the-client, kind: deny_dependency, from: lct.frontend.logic, to: lct.backend, edge_types: [FETCHES]}
  # State and orchestration on top, components below, then pure helpers and
  # the client, then the shared types and the stylesheet.
  - id: frontend-layers
    kind: layers
    layers:
      - lct.frontend.app
      - lct.frontend.components
      - [lct.frontend.logic, lct.frontend.client]
      - [lct.frontend.types, lct.frontend.styles]
    edge_types: *observed
  # The solver stays behind the planning core; tests may drive it directly.
  - {id: only-the-core-uses-the-solver, kind: allow_only_from, to: libs.ortools, from: [lct.backend.core, lct.tests]}
  # Screens are assembled from panels, panels use the map, shared elements
  # are at the bottom.
  - id: component-layers
    kind: layers
    layers:
      - lct.frontend.components.screens
      - lct.frontend.components.panels
      - lct.frontend.components.map
      - lct.frontend.components.common
    edge_types: *observed
